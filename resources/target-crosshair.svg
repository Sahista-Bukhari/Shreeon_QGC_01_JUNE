<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- DJI-style crosshair design -->
  <!-- Vertical line - top part -->
  <line x1="12" y1="1" x2="12" y2="9" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Vertical line - bottom part -->
  <line x1="12" y1="15" x2="12" y2="23" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Horizontal line - left part -->
  <line x1="1" y1="12" x2="9" y2="12" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Horizontal line - right part -->
  <line x1="15" y1="12" x2="23" y2="12" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
</svg>

