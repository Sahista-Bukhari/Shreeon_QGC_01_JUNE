<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72">
    <!-- Modern horizontal battery - EMERGENCY (Red with exclamation) -->
    <!-- Battery body outline -->
    <rect x="4" y="20" width="56" height="32" rx="4" ry="4"
          style="fill:none;stroke:#dc2626;stroke-width:3"/>
    <!-- Battery terminal -->
    <rect x="60" y="28" width="8" height="16" rx="2" ry="2"
          style="fill:#dc2626;stroke:none"/>
    <!-- Exclamation mark -->
    <rect x="28" y="26" width="4" height="12" rx="1" ry="1"
          style="fill:#dc2626;stroke:none"/>
    <circle cx="30" cy="44" r="2.5"
          style="fill:#dc2626;stroke:none"/>
</svg>
