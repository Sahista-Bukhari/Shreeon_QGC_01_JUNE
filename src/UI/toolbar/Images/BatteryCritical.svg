<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72">
    <!-- Modern horizontal battery - CRITICAL (Red) -->
    <defs>
        <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#ef4444;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#dc2626;stop-opacity:1" />
        </linearGradient>
    </defs>
    <!-- Battery body outline -->
    <rect x="4" y="20" width="56" height="32" rx="4" ry="4"
          style="fill:none;stroke:#ef4444;stroke-width:3"/>
    <!-- Battery terminal -->
    <rect x="60" y="28" width="8" height="16" rx="2" ry="2"
          style="fill:#ef4444;stroke:none"/>
    <!-- Battery fill - 10% -->
    <rect x="8" y="24" width="6" height="24" rx="2" ry="2"
          style="fill:url(#redGrad);stroke:none"/>
</svg>
