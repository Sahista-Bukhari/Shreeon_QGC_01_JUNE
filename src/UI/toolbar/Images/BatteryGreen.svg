<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72">
    <!-- Modern horizontal battery - FULL (Green) -->
    <defs>
        <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#22c55e;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#16a34a;stop-opacity:1" />
        </linearGradient>
    </defs>
    <!-- Battery body outline -->
    <rect x="4" y="20" width="56" height="32" rx="4" ry="4"
          style="fill:none;stroke:#22c55e;stroke-width:3"/>
    <!-- Battery terminal -->
    <rect x="60" y="28" width="8" height="16" rx="2" ry="2"
          style="fill:#22c55e;stroke:none"/>
    <!-- Battery fill - 100% -->
    <rect x="8" y="24" width="48" height="24" rx="2" ry="2"
          style="fill:url(#greenGrad);stroke:none"/>
</svg>
